name: Build plugin zip

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package plugin as festival-sync/
        run: |
          mkdir festival-sync
          cp -r festival-sync.php uninstall.php README.md includes festival-sync/
          zip -r festival-sync.zip festival-sync
      - uses: actions/upload-artifact@v4
        with:
          name: festival-sync
          path: festival-sync.zip
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" festival-sync.zip --clobber
